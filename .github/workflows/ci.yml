name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[qa]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: End-to-end example
        run: python examples/quickstart.py
      - name: Artifact preflight
        run: python scripts/check_figure.py outputs/quickstart.pdf --metadata outputs/quickstart.provenance.json
