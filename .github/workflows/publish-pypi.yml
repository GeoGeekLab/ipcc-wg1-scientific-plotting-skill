name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - ".release/v*.md"

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions from the release tag
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist/
      - name: Publish ar6-sciplot to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  validate-request:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate release commit
        run: |
          python -m pip install -e ".[qa]"
          ruff check .
          pytest -q

  prepare-request:
    if: github.event_name == 'push'
    needs: validate-request
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: release
        name: Create version tag
        shell: bash
        run: |
          set -euo pipefail

          notes="$(git show --pretty='' --name-only "$GITHUB_SHA" -- '.release/v*.md' | head -n1)"
          test -n "$notes"

          tag="$(basename "$notes" .md)"
          version="${tag#v}"

          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --tags --force

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag already exists: $tag" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "$tag"
          git push origin "$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

  build-request:
    if: github.event_name == 'push'
    needs: prepare-request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-request.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build v${{ needs.prepare-request.outputs.version }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          ls "dist/ar6_sciplot-${{ needs.prepare-request.outputs.version }}-py3-none-any.whl"
          ls "dist/ar6_sciplot-${{ needs.prepare-request.outputs.version }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions-request
          path: dist/
          if-no-files-found: error

  publish-request:
    if: github.event_name == 'push'
    needs:
      - prepare-request
      - build-request
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-distributions-request
          path: dist/
      - name: Publish v${{ needs.prepare-request.outputs.version }} to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release-request:
    if: github.event_name == 'push'
    needs:
      - prepare-request
      - build-request
      - publish-request
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-request.outputs.tag }}
      - uses: actions/download-artifact@v5
        with:
          name: python-distributions-request
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-request.outputs.tag }}
          NOTES: ${{ needs.prepare-request.outputs.notes }}
        run: |
          gh release create "$TAG" dist/*             --repo "$GITHUB_REPOSITORY"             --title "$TAG — Benchmark it. Regress it. Ship it."             --notes-file "$NOTES"
