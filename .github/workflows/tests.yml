name: tests

on:
  push:
    branches: [main, ipcc-native-v1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[qa]"
      - name: Ruff
        run: ruff check scripts tests
      - name: Pytest
        run: pytest -q
      - name: Validate native recipe
        run: |
          python - <<'PY'
          from ipcc_sciplot import load_ipcc_native_recipe
          r = load_ipcc_native_recipe("templates/ipcc_native_recipe.yaml")
          print(r.figure_id, r.assessment["archetype"])
          PY
