name: IPCC source-data reproductions

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/ipcc_reference/**"
      - "scripts/ipcc_sciplot/**"
      - ".github/workflows/reference-reproductions.yml"
  pull_request:
    paths:
      - "examples/ipcc_reference/**"
      - "scripts/ipcc_sciplot/**"
      - ".github/workflows/reference-reproductions.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[qa]" cartopy

      - name: Lint
        run: ruff check examples/ipcc_reference scripts/ipcc_sciplot

      - name: Preserve committed image baseline
        run: cp -R examples/ipcc_reference/outputs /tmp/ipcc-reference-baseline

      - name: Generate reference reproductions and check figure contracts
        run: python examples/ipcc_reference/generate_all.py

      - name: Report image regression metrics
        run: |
          python examples/ipcc_reference/compare_regressions.py \
            --baseline /tmp/ipcc-reference-baseline \
            --candidate examples/ipcc_reference/outputs \
            --output examples/ipcc_reference/outputs/regression_report.json

      - name: Verify committed reference gallery
        run: |
          git diff --exit-code -- \
            examples/ipcc_reference/outputs/*.png \
            examples/ipcc_reference/outputs/manifest.json

      - name: List outputs
        run: ls -lh examples/ipcc_reference/outputs

      - uses: actions/upload-artifact@v4
        with:
          name: ipcc-reference-reproductions
          path: examples/ipcc_reference/outputs/
          if-no-files-found: error
