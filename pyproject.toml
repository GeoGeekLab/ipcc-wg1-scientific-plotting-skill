[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipcc-wg1-scientific-plotting-skill"
version = "0.1.0"
description = "A reproducible scientific plotting skill distilled from IPCC AR6 WGI practices"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "xarray>=2024.6",
  "scipy>=1.11",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
climate = [
  "dask[array]>=2024.6",
  "cartopy>=0.23",
  "regionmask>=0.12",
  "cf-xarray>=0.9",
  "pint-xarray>=0.4",
  "flox>=0.9",
  "cmocean>=4.0",
  "xclim>=0.50",
  "xesmf>=0.8",
  "zarr>=2.18",
  "pyam-iamc>=2.2",
]
qa = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-mpl>=0.17",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
]
workflow = [
  "snakemake>=8",
  "conda-lock>=2.5",
]

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
