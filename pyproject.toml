[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ar6-sciplot"
dynamic = ["version"]
description = "Evidence-backed plotting helpers and fidelity checks distilled from IPCC AR6 WGI visual practice"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "GeoGeekLab" },
]
keywords = [
  "ar6",
  "climate-science",
  "data-visualization",
  "ipcc",
  "matplotlib",
  "scientific-plotting",
  "scientific-visualization",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "xarray>=2024.6",
  "scipy>=1.11",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
climate = [
  "dask[array]>=2024.6",
  "cartopy>=0.23",
  "regionmask>=0.12",
  "cf-xarray>=0.9",
  "pint-xarray>=0.4",
  "flox>=0.9",
  "xclim>=0.50",
  "xesmf>=0.8",
  "zarr>=2.18",
  "pyam-iamc>=2.2",
]
qa = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-mpl>=0.17",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "build>=1.2",
  "twine>=6",
]
workflow = [
  "snakemake>=8",
  "conda-lock>=2.5",
]

[project.scripts]
ar6plot = "ipcc_sciplot.cli:main"

[project.urls]
Homepage = "https://github.com/GeoGeekLab/ipcc-wg1-scientific-plotting-skill"
Repository = "https://github.com/GeoGeekLab/ipcc-wg1-scientific-plotting-skill"
Issues = "https://github.com/GeoGeekLab/ipcc-wg1-scientific-plotting-skill/issues"
Releases = "https://github.com/GeoGeekLab/ipcc-wg1-scientific-plotting-skill/releases"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.setuptools_scm]
fallback_version = "0+unknown"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ipcc_sciplot"]
